<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img" aria-labelledby="title desc">
<title id="title">Atividade no GitHub: primeira sincronização autenticada pendente</title>
<desc id="desc">Este painel será substituído automaticamente pelos números oficiais de contribuições dos últimos doze meses, incluindo privadas autorizadas, assim que o token for configurado.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06170F"/><stop offset="1" stop-color="#0B2820"/></linearGradient></defs>
<rect width="1060" height="410" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1058" height="408" rx="19" fill="none" stroke="#25543F" stroke-width="2"/>
<text x="36" y="49" fill="#85D7AA" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">ARCIS / GITHUB ACTIVITY</text>
<text x="36" y="88" fill="#E9F4ED" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Aguardando primeira sincronização oficial</text>
<text x="36" y="117" fill="#A9D0B8" font-family="Arial,Helvetica,sans-serif" font-size="15">Contribuições pessoais elegíveis, calendário anual e indicadores de atividade.</text>
<rect x="36" y="145" width="309" height="101" rx="12" fill="#103927"/>
<rect x="375" y="145" width="309" height="101" rx="12" fill="#103927"/>
<rect x="714" y="145" width="309" height="101" rx="12" fill="#103927"/>
<text x="53" y="178" fill="#ABD9BE" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">CONTRIBUIÇÕES</text>
<text x="392" y="178" fill="#ABD9BE" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">COMMITS ELEGÍVEIS</text>
<text x="731" y="178" fill="#ABD9BE" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">CALENDÁRIO DE 12 MESES</text>
<text x="53" y="226" fill="#E9F4ED" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">—</text>
<text x="392" y="226" fill="#E9F4ED" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">—</text>
<text x="731" y="226" fill="#E9F4ED" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">—</text>
<path d="M36 278 H1023" stroke="#25543F"/>
<text x="36" y="315" fill="#E9F4ED" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">Ativação única: PROFILE_STATS_TOKEN</text>
<text x="36" y="347" fill="#A9D0B8" font-family="Arial,Helvetica,sans-serif" font-size="15">Após autorização, atualização automática a cada 6 horas por GitHub Actions.</text>
<text x="36" y="381" fill="#8BBA9D" font-family="Arial,Helvetica,sans-serif" font-size="13">Sem números simulados • Nenhum código ou nome de repositório privado exposto</text>
</svg>
